# Local full stack (db, redis, api, worker+beat):  docker compose up --build
# Only the databases for `uv run` development:  docker compose up -d db redis
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-innerspace}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Runs once on first start: creates the separate test database.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API. Applies migrations on start, then serves on http://localhost:8000.
  api:
    build: ./backend
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000 --no-proxy-headers"]
    environment: &app-env
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-innerspace}
      CELERY_BROKER_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-anthropic:claude-sonnet-5-5}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      JOB_STALE_AFTER_SECONDS: ${JOB_STALE_AFTER_SECONDS:-900}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Background jobs (AI summary generation) + the embedded scheduler (--beat): stale-job
  # reaper and expired refresh-token cleanup. Same image as the API, different command.
  worker:
    build: ./backend
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=INFO", "--concurrency=2", "--beat", "--schedule=/tmp/celerybeat-schedule"]
    environment: *app-env
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db_data:
