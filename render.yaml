# Render Blueprint (New -> Blueprint). Secrets are never stored here: `sync: false` values are
# asked for in the dashboard on first sync. See README "Deploying to Render".
# Every resource uses the same region (required for private networking).
services:
  # --- Frontend (static site) ---
  - type: web
    name: innerspace-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL # public API URL, e.g. https://innerspace-api.onrender.com (build time)
        sync: false

  # --- API + Celery worker + beat in ONE container (Starter, 512 MB) ---
  # `start.sh` runs uvicorn and a thread-pool Celery worker with embedded beat; if either
  # dies the container exits and Render restarts it. Database: Supabase (free), not Render.
  - type: web
    name: innerspace-api
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: ./start.sh
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT # start.sh / uvicorn listen here
        value: "8000"
      - key: TRUSTED_PROXY_HOPS # Render puts exactly one proxy in front; verify after deploy
        value: "1"
      - key: RATE_LIMIT_BACKEND
        value: redis
      # Public demo: one-click sign-in to the seeded demo-clinic accounts (synthetic data only).
      - key: DEMO_LOGIN_ENABLED
        value: "true"
      - key: CELERY_CONCURRENCY # worker threads; keep low for the 512 MB instance
        value: "2"
      - key: MALLOC_ARENA_MAX # caps glibc per-thread arenas (threaded worker) to limit RSS growth
        value: "2"
      # Supabase free tier: few pooler connections. The API pool plus one engine per running
      # job must stay well under the pooler's client limit.
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DATABASE_URL # Supabase SESSION pooler URI (IPv4, port 5432) + ?sslmode=require
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: innerspace-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS # the frontend origin, e.g. https://innerspace-web.onrender.com
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: METRICS_TOKEN # optional; blank = /metrics disabled
        sync: false
      - key: LOGFIRE_TOKEN # optional; blank = tracing off
        sync: false

  # --- Redis-compatible Key Value (rate limits + Celery broker), internal access only ---
  - type: keyvalue
    name: innerspace-redis
    region: frankfurt
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
